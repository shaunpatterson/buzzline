<!doctype html>
<!-- The Buzzline PDF reader. Opened from the "Open in PDF reader" menu entry
     (src/background.js) with ?file=<address>; the logic is in pdf.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzzline PDF reader</title>
<link rel="icon" type="image/png" sizes="48x48" href="../icons/icon48.png">
<link rel="icon" type="image/png" sizes="128x128" href="../icons/icon128.png">
<link rel="stylesheet" href="content.css">
<style>
  :root {
    --bg: #f1efea; --panel: #ffffff; --ink: #1b1c20; --muted: #6d717a; --line: #e2dfd8; --hover: #f3f1ec;
    --accent: #f7c948; --accent-ink: #1a1a1a; --shadow: 0 1px 2px #0000000d, 0 8px 28px #00000014; --paper: #ffffff;
  }
  body.dark {
    --bg: #0d0f13; --panel: #171a20; --ink: #e9eaee; --muted: #969ca8; --line: #272b34; --hover: #20242c;
    --shadow: 0 1px 2px #0006, 0 8px 28px #0008; --paper: #15171c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-padding-top: 44px; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }

  /* ---- app bar ---- */
  /* Title takes what is left; the view switch and tools never shrink or overlap.
     As the window narrows: labels become icons, the scheme swatches fold into
     one swatch with a menu, then the status line and the Sprint label go. */
  #bar { position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px;
    height: 32px; padding: 0 10px; font-size: 12.5px; background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
  @media (min-width: 1400px) { #bar { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); } }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .brand img { flex: none; width: 22px; height: 22px; }
  .doc { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  #title { flex: 0 2 auto; min-width: 0; font-weight: 650; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
  #meta { flex: 0 1 auto; min-width: 0; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: inline-flex; padding: 2px; gap: 1px; background: var(--hover); border: 1px solid var(--line); border-radius: 7px; }
  .seg button { border: 0; background: none; padding: 1px 11px; line-height: 18px; border-radius: 5px; cursor: pointer; font-weight: 550; color: var(--muted); transition: background .15s, color .15s; }
  .seg button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px #0000001f; }
  .tools { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  .schemewrap { position: relative; display: flex; align-items: center; }
  .schemes { display: flex; gap: 5px; padding-right: 2px; }
  .schemes button, #schemeBtn { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--panel); outline: 1px solid var(--line); cursor: pointer; padding: 0; transition: transform .12s; }
  .schemes button:hover, #schemeBtn:hover { transform: scale(1.08); }
  .schemes button[aria-pressed="true"] { outline: 2px solid var(--muted); }
  #schemeBtn { display: none; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 550; white-space: nowrap; }
  .btn svg { width: 13px; height: 13px; }
  #sprint svg { width: 8px; height: 9px; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: #0000001a; color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.05); background: var(--accent); }
  .btn.icon { width: 24px; padding: 0; justify-content: center; }
  .btn[aria-pressed="true"] { background: color-mix(in srgb, var(--muted) 32%, var(--panel)); border-color: color-mix(in srgb, var(--muted) 45%, var(--panel)); }
  .sep { width: 1px; height: 14px; background: var(--line); }
  .grp { display: inline-flex; }
  .grp .btn { width: 26px; padding: 0; justify-content: center; border-radius: 0; font-weight: 650; line-height: 1; }
  .grp .btn:first-child { border-radius: 6px 0 0 6px; }
  .grp .btn:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
  #smaller { font-size: 10px; } #larger { font-size: 15px; }
  .btn:disabled { opacity: .4; cursor: default; }
  #progress { position: sticky; top: 32px; z-index: 19; height: 2px; }
  #progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  /* ---- open panel ---- */
  #openPanel { position: fixed; top: 38px; right: 10px; z-index: 30; width: 380px; padding: 16px; font-size: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  #openPanel .btn { height: 34px; padding: 0 13px; border-radius: 9px; }
  #openPanel h3 { margin: 0 0 10px; font-size: 13px; font-weight: 650; }
  #openPanel .row { display: flex; gap: 8px; }
  #openPanel input[type=text] { flex: 1; min-width: 0; height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); }
  #openPanel input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #openPanel .or { margin: 12px 0 8px; font-size: 12px; color: var(--muted); }
  #openPanel #pick { width: 100%; justify-content: center; border-style: dashed; height: 54px; color: var(--muted); }

  /* ---- states ---- */
  #empty { display: grid; place-items: center; min-height: calc(100vh - 34px); text-align: center; color: var(--muted); padding: 24px; }
  #empty .big { font-size: 17px; font-weight: 600; color: var(--ink); margin: 14px 0 4px; }
  .spinner { width: 30px; height: 30px; margin: 0 auto; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #drop { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(4px); }
  #drop div { padding: 34px 52px; border: 2px dashed var(--accent); border-radius: 18px; font-size: 17px; font-weight: 600; background: var(--panel); }
  body.dragging #drop { display: grid; }

  /* ---- A: original layout ---- */
  #view { padding: 22px 16px 80px; }
  .sheet { margin: 0 auto 26px; }
  .sheet .num { margin: 0 2px 7px; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .page { position: relative; isolation: isolate; background: #fff; border-radius: 3px; box-shadow: var(--shadow); overflow: hidden; }
  .page canvas { display: block; }
  .strip { position: absolute; pointer-events: none; mix-blend-mode: screen; background-repeat: no-repeat; }
  /* The inverted page is pure black. A cool dark grey screened over the finished
     page (after the strips) lifts the black to the surrounding blue-grey; a
     neutral grey reads as brown next to it. White text is unchanged. */
  body.dark .page { background: #000; }
  body.dark .page::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: #1b1f27; mix-blend-mode: screen; }
  body.dark .page canvas { filter: invert(1) hue-rotate(180deg); }
  body.dark .strip { mix-blend-mode: multiply; }

  /* ---- B: reader ---- */
  .reflow { max-width: 720px; margin: 8px auto 0; padding: 56px 64px 64px; background: var(--paper); color: var(--ink); border-radius: 14px; box-shadow: var(--shadow);
    font: calc(19px * var(--size, 1))/1.7 "Iowan Old Style", "Palatino Linotype", Charter, Georgia, serif; }
  .reflow h1 { font: 700 calc(30px * var(--size, 1))/1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: -.02em; margin: 0 0 1.2em; }
  .reflow h2 { font: 650 calc(20px * var(--size, 1))/1.3 ui-sans-serif, system-ui, sans-serif; letter-spacing: -.01em; margin: 2em 0 .5em; }
  .reflow p { margin: 0 0 1.05em; }
  .reflow p.minor { font: calc(13.5px * var(--size, 1))/1.5 ui-sans-serif, system-ui, sans-serif; color: var(--muted); }
  .reflow .pagebreak { display: flex; align-items: center; gap: 12px; margin: 2em 0; font: 11px ui-sans-serif, system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .reflow .pagebreak::before, .reflow .pagebreak::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  @media (max-width: 1180px) {
    #bodyOnly .lbl, #openBtn .lbl { display: none; }
    #bodyOnly, #openBtn { width: 24px; padding: 0; justify-content: center; }
    .sep { display: none; }
  }
  @media (max-width: 920px) {
    #schemeBtn { display: block; }
    .schemes { display: none; position: absolute; top: 27px; right: -6px; padding: 8px 10px; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
    .schemewrap.open .schemes { display: flex; }
  }
  @media (max-width: 760px) { .reflow { padding: 32px 24px; border-radius: 0; } }
  @media (max-width: 640px) {
    #bar { gap: 8px; padding: 0 8px; }
    #meta, #sprint .lbl { display: none; }
    #sprint { width: 24px; padding: 0; justify-content: center; }
    .seg button { padding: 1px 8px; }
    .tools { gap: 5px; }
    #openPanel { right: 8px; width: calc(100vw - 16px); }
  }
  @media (max-width: 470px) { .doc { display: none; } }
</style>
</head>
<body>
<header id="bar">
  <div class="brand">
    <img src="../icons/icon48.png" alt="Buzzline">
    <div class="doc"><div id="title">Buzzline PDF reader</div><div id="meta"></div></div>
  </div>
  <div class="seg" role="tablist" aria-label="View">
    <button role="tab" data-v="A" title="The PDF's own layout (←)">Original</button>
    <button role="tab" data-v="B" title="Text reflowed into a reading column (→)">Reader</button>
  </div>
  <div class="tools">
    <div class="schemewrap" id="schemeWrap">
      <button id="schemeBtn" title="Colour scheme" aria-haspopup="true"></button>
      <div class="schemes" id="schemes" aria-label="Colour scheme"></div>
    </div>
    <div class="grp" role="group" aria-label="Text size">
      <button class="btn" id="smaller" title="Smaller text (−)">A</button>
      <button class="btn" id="larger" title="Larger text (+)">A</button>
    </div>
    <span class="sep"></span>
    <button class="btn" id="bodyOnly" aria-pressed="true" title="Body text only: colour just the paragraphs, not every line of text">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="lbl">Body text only</span>
    </button>
    <button class="btn icon" id="theme" aria-pressed="false" title="Dark page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
    <button class="btn" id="openBtn" title="Open a PDF">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg><span class="lbl">Open…</span>
    </button>
    <button class="btn primary" id="sprint" title="Sprint: flash the body text one word at a time">
      <svg width="11" height="12" viewBox="0 0 11 12"><path d="M0 0l11 6-11 6Z" fill="currentColor"/></svg><span class="lbl">Sprint</span>
    </button>
  </div>
</header>
<div id="progress"><i></i></div>

<div id="openPanel" hidden>
  <h3>Open a PDF</h3>
  <div class="row"><input type="text" id="url" placeholder="https://arxiv.org/pdf/…" spellcheck="false"><button class="btn primary" id="load">Open</button></div>
  <div class="or">or</div>
  <button class="btn" id="pick">Choose a file, or drop one anywhere</button>
  <input type="file" id="file" accept="application/pdf" hidden>
</div>

<div id="empty"><div><div class="spinner"></div><div class="big" id="emptyBig">Opening PDF…</div><div id="emptySmall"></div></div></div>
<main id="view" hidden></main>
<div id="drop"><div>Drop a PDF to open it</div></div>

<script src="core.js"></script>
<script src="settings.js"></script>
<script src="intents.js"></script>
<script src="schedule.js"></script>
<script src="gradient.js"></script>
<script src="blocks.js"></script>
<script src="reading.js"></script>
<script src="sprint.js"></script>
<script src="content.js"></script>
<script type="module" src="pdf.js"></script>
</body>
</html>
