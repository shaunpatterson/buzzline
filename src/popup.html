<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot"></span>
      <h1>Buzzline</h1>
    </div>
    <label class="switch" title="Toggle Buzzline">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </header>
  <section class="controls">
    <label for="scheme">Color scheme</label>
    <select id="scheme"></select>
    <label class="site-only"><input type="checkbox" id="site-only" disabled> Only for this site</label>
  </section>
  <section class="actions">
    <button type="button" id="sprint-page-btn" class="action-btn">Sprint this page</button>
    <button type="button" id="open-reader-btn" class="action-btn">Open reader</button>
  </section>
  <section class="site-row" id="site-row" hidden>
    <div class="site-label">
      <span class="site-caption">Enabled on</span>
      <span class="site-host" id="site-host"></span>
    </div>
    <label class="switch switch-sm" title="Enable Buzzline on this site">
      <input type="checkbox" id="site-toggle">
      <span class="slider"></span>
    </label>
  </section>
  <section class="preview-wrap">
    <div id="preview" class="preview"></div>
  </section>
  <section class="feedback" title="Select some text on the page first. Stores the block's features locally (never the text) for improving the model.">
    <span class="feedback-caption">Selected text…</span>
    <button type="button" id="fb-no" class="fb-btn">shouldn't be colored</button>
    <button type="button" id="fb-yes" class="fb-btn">should be colored</button>
  </section>
  <footer>
    <p class="hint">Changes apply on page reload if coloring isn't visible right away.</p>
    <a class="settings-link" id="settings-link" href="#">Open settings…</a>
  </footer>
  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
