<!doctype html>
<!-- PROTOTYPE — throwaway (see NOTES.md). Question: what should Buzzline look like on a PDF?
     Two views, switchable with the Original / Reader control, the arrow keys, or ?variant=A|B:
       A  Original: the PDF's own layout (pdf.js canvas) with a gradient blended over each text line
       B  Reader:   the text reflowed into a reading column, coloured by the real extension code
     Run: node prototype/pdf-viewer/serve.js   (or the Docker image, see NOTES.md) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzzline PDF (prototype)</title>
<link rel="stylesheet" href="/src/content.css">
<style>
  :root {
    --bg: #f1efea; --panel: #ffffff; --ink: #1b1c20; --muted: #6d717a; --line: #e2dfd8; --hover: #f3f1ec;
    --accent: #f7c948; --accent-ink: #1a1a1a; --shadow: 0 1px 2px #0000000d, 0 8px 28px #00000014; --paper: #ffffff;
  }
  body.dark {
    --bg: #0d0f13; --panel: #171a20; --ink: #e9eaee; --muted: #969ca8; --line: #272b34; --hover: #20242c;
    --shadow: 0 1px 2px #0006, 0 8px 28px #0008; --paper: #15171c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-padding-top: 44px; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }

  /* ---- app bar ---- */
  /* Title takes what is left; the view switch and tools never shrink or overlap.
     As the window narrows: labels become icons, the scheme swatches fold into
     one swatch with a menu, then the status line and the Sprint label go. */
  #bar { position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px;
    height: 32px; padding: 0 10px; font-size: 12.5px; background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
  @media (min-width: 1400px) { #bar { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); } }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .brand svg { flex: none; width: 18px; height: 18px; }
  .doc { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  #title { flex: 0 1 auto; min-width: 0; font-weight: 650; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
  #meta { flex: 0 10000 auto; min-width: 0; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: inline-flex; padding: 2px; gap: 1px; background: var(--hover); border: 1px solid var(--line); border-radius: 7px; }
  .seg button { border: 0; background: none; padding: 1px 11px; line-height: 18px; border-radius: 5px; cursor: pointer; font-weight: 550; color: var(--muted); transition: background .15s, color .15s; }
  .seg button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px #0000001f; }
  .tools { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  .schemewrap { position: relative; display: flex; align-items: center; }
  .schemes { display: flex; gap: 5px; padding-right: 2px; }
  .schemes button, #schemeBtn { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--panel); outline: 1px solid var(--line); cursor: pointer; padding: 0; transition: transform .12s; }
  .schemes button:hover, #schemeBtn:hover { transform: scale(1.08); }
  .schemes button[aria-pressed="true"] { outline: 2px solid var(--ink); }
  #schemeBtn { display: none; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 550; white-space: nowrap; }
  .btn svg { width: 13px; height: 13px; }
  #sprint svg { width: 8px; height: 9px; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: #0000001a; color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.05); background: var(--accent); }
  .btn.icon { width: 24px; padding: 0; justify-content: center; }
  .btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .sep { width: 1px; height: 14px; background: var(--line); }
  #progress { position: sticky; top: 32px; z-index: 19; height: 2px; }
  #progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  /* ---- open panel ---- */
  #openPanel { position: fixed; top: 38px; right: 10px; z-index: 30; width: 380px; padding: 16px; font-size: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  #openPanel .btn { height: 34px; padding: 0 13px; border-radius: 9px; }
  #openPanel h3 { margin: 0 0 10px; font-size: 13px; font-weight: 650; }
  #openPanel .row { display: flex; gap: 8px; }
  #openPanel input[type=text] { flex: 1; min-width: 0; height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); }
  #openPanel input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #openPanel .or { margin: 12px 0 8px; font-size: 12px; color: var(--muted); }
  #openPanel #pick { width: 100%; justify-content: center; border-style: dashed; height: 54px; color: var(--muted); }

  /* ---- states ---- */
  #empty { display: grid; place-items: center; min-height: calc(100vh - 34px); text-align: center; color: var(--muted); padding: 24px; }
  #empty .big { font-size: 17px; font-weight: 600; color: var(--ink); margin: 14px 0 4px; }
  .spinner { width: 30px; height: 30px; margin: 0 auto; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #drop { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(4px); }
  #drop div { padding: 34px 52px; border: 2px dashed var(--accent); border-radius: 18px; font-size: 17px; font-weight: 600; background: var(--panel); }
  body.dragging #drop { display: grid; }

  /* ---- A: original layout ---- */
  #view { padding: 22px 16px 80px; }
  .sheet { margin: 0 auto 26px; }
  .sheet .num { margin: 0 2px 7px; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .page { position: relative; isolation: isolate; background: #fff; border-radius: 3px; box-shadow: var(--shadow); overflow: hidden; }
  .page canvas { display: block; }
  .strip { position: absolute; pointer-events: none; mix-blend-mode: screen; background-repeat: no-repeat; }
  body.dark .page { background: #000; }
  body.dark .page canvas { filter: invert(1) hue-rotate(180deg); }
  body.dark .strip { mix-blend-mode: multiply; }

  /* ---- B: reader ---- */
  .reflow { max-width: 720px; margin: 8px auto 0; padding: 56px 64px 64px; background: var(--paper); color: var(--ink); border-radius: 14px; box-shadow: var(--shadow);
    font: 19px/1.7 "Iowan Old Style", "Palatino Linotype", Charter, Georgia, serif; }
  .reflow h1 { font: 700 30px/1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: -.02em; margin: 0 0 1.2em; }
  .reflow h2 { font: 650 20px/1.3 ui-sans-serif, system-ui, sans-serif; letter-spacing: -.01em; margin: 2em 0 .5em; }
  .reflow p { margin: 0 0 1.05em; }
  .reflow p.minor { font: 13.5px/1.5 ui-sans-serif, system-ui, sans-serif; color: var(--muted); }
  .reflow .pagebreak { display: flex; align-items: center; gap: 12px; margin: 2em 0; font: 11px ui-sans-serif, system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .reflow .pagebreak::before, .reflow .pagebreak::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  @media (max-width: 1180px) {
    #bodyOnly .lbl, #openBtn .lbl { display: none; }
    #bodyOnly, #openBtn { width: 24px; padding: 0; justify-content: center; }
    .sep { display: none; }
  }
  @media (max-width: 920px) {
    #schemeBtn { display: block; }
    .schemes { display: none; position: absolute; top: 27px; right: -6px; padding: 8px 10px; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
    .schemewrap.open .schemes { display: flex; }
  }
  @media (max-width: 760px) { .reflow { padding: 32px 24px; border-radius: 0; } }
  @media (max-width: 640px) {
    #bar { gap: 8px; padding: 0 8px; }
    #meta, #sprint .lbl { display: none; }
    #sprint { width: 24px; padding: 0; justify-content: center; }
    .seg button { padding: 1px 8px; }
    .tools { gap: 5px; }
    #openPanel { right: 8px; width: calc(100vw - 16px); }
  }
  @media (max-width: 470px) { .doc { display: none; } }
</style>
</head>
<body>
<header id="bar">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 20 20" aria-hidden="true"><rect width="20" height="20" rx="5" fill="#f7c948"/><path d="M7.5 5.2 15 10l-7.5 4.8Z" fill="#1a1a1a"/></svg>
    <div class="doc"><div id="title">Buzzline PDF</div><div id="meta">prototype</div></div>
  </div>
  <div class="seg" role="tablist" aria-label="View">
    <button role="tab" data-v="A" title="The PDF's own layout (←)">Original</button>
    <button role="tab" data-v="B" title="Text reflowed into a reading column (→)">Reader</button>
  </div>
  <div class="tools">
    <div class="schemewrap" id="schemeWrap">
      <button id="schemeBtn" title="Colour scheme" aria-haspopup="true"></button>
      <div class="schemes" id="schemes" aria-label="Colour scheme"></div>
    </div>
    <span class="sep"></span>
    <button class="btn" id="bodyOnly" aria-pressed="true" title="Body text only: colour just the paragraphs, not every line of text">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="lbl">Body text only</span>
    </button>
    <button class="btn icon" id="theme" aria-pressed="false" title="Dark page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
    <button class="btn" id="openBtn" title="Open a PDF">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg><span class="lbl">Open…</span>
    </button>
    <button class="btn primary" id="sprint" title="Sprint: flash the body text one word at a time">
      <svg width="11" height="12" viewBox="0 0 11 12"><path d="M0 0l11 6-11 6Z" fill="currentColor"/></svg><span class="lbl">Sprint</span>
    </button>
  </div>
</header>
<div id="progress"><i></i></div>

<div id="openPanel" hidden>
  <h3>Open a PDF</h3>
  <div class="row"><input type="text" id="url" placeholder="https://arxiv.org/pdf/…" spellcheck="false"><button class="btn primary" id="load">Open</button></div>
  <div class="or">or</div>
  <button class="btn" id="pick">Choose a file, or drop one anywhere</button>
  <input type="file" id="file" accept="application/pdf" hidden>
</div>

<div id="empty"><div><div class="spinner"></div><div class="big" id="emptyBig">Opening PDF…</div><div id="emptySmall"></div></div></div>
<main id="view" hidden></main>
<div id="drop"><div>Drop a PDF to open it</div></div>

<script type="module">
import * as pdfjs from '/vendor/pdfjs/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.min.mjs';

const VARIANTS = ['A', 'B'];
const params = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const state = {
  variant: VARIANTS.includes(params.get('variant')) ? params.get('variant') : 'A',
  scheme: params.get('scheme') || 'classic',
  dark: params.has('dark') ? params.get('dark') === '1' : matchMedia('(prefers-color-scheme: dark)').matches,
  bodyOnly: params.get('all') !== '1',
  file: params.get('file') || 'https://arxiv.org/pdf/1706.03762',
  pages: [], bodyH: 0, name: '', total: 0
};
const MAX_PAGES = 15;
const pageWidth = () => Math.max(320, Math.min(900, innerWidth - 32));

// ---- the real extension code, with a fake chrome (as tests/e2e/page.js does) ----
const sync = { enabled: true, scheme: state.scheme };
const onChanged = [];
window.chrome = {
  storage: {
    sync: { get: (k, cb) => setTimeout(() => cb({ ...sync }), 0), set(o) { const ch = {}; for (const k in o) { ch[k] = { newValue: o[k] }; sync[k] = o[k]; } onChanged.forEach((f) => f(ch, 'sync')); } },
    local: { get: (k, cb) => cb({}), set() {} }, onChanged: { addListener: (f) => onChanged.push(f) }
  },
  runtime: { onMessage: { addListener() {} } }
};
const manifest = await (await fetch('/manifest.json')).json();
for (const f of manifest.content_scripts[0].js) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = '/' + f; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
const { SCHEMES } = window.BuzzlineCore;
// Join two lines of one paragraph: a word broken at the line end loses its
// hyphen ("transduc-" + "tion"); a hyphenated compound keeps it ("English-" + "to-German").
const join = (a, b) => (!a ? b : /[a-z]-$/.test(a) && /^[a-z]/.test(b) ? (/^[a-z]+-/.test(b) ? a + b : a.slice(0, -1) + b) : a + ' ' + b);

// ---- PDF -> lines -> blocks ----
function toLines(items) {
  const lines = []; let c = null;
  for (const it of items) {
    const brk = !c || Math.abs(it.y - c.y) > 0.5 * c.h || it.x < c.right - c.h || it.x - c.right > 3 * c.h;
    if (brk) { c = { y: it.y, h: it.h, left: it.x, right: it.x + it.w, text: it.str }; lines.push(c); }
    else { c.text += ((it.x - c.right > 0.15 * c.h || c.sp) && !/\s$/.test(c.text) ? ' ' : '') + it.str; c.right = Math.max(c.right, it.x + it.w); c.h = Math.max(c.h, it.h); }
    c.sp = !!it.spaceAfter;
  }
  return lines;
}
function toBlocks(lines) {
  const blocks = []; let b = null, prev = null;
  for (const l of lines) {
    const gap = prev ? (l.y - l.h) - prev.y : 0;
    const brk = !b || Math.abs(l.h - b.h) / b.h > 0.08 || gap > 0.6 * b.h || l.y < prev.y - 0.5 * b.h ||
      Math.abs(l.left - b.left) > 3 * b.h || (b.lines.length >= 2 && l.left > b.left + 0.7 * b.h);   // indent = new paragraph
    if (brk) { b = { lines: [], h: l.h, left: l.left, right: l.right }; blocks.push(b); }
    b.lines.push(l); b.left = Math.min(b.left, l.left); b.right = Math.max(b.right, l.right);
    prev = l;
  }
  for (const k of blocks) {
    k.text = k.lines.reduce((t, l) => join(t, l.text), '')
      .replace(/([\[(])\s+/g, '$1').replace(/\s+([\]),.;:])/g, '$1');   // "[ 27 ]" -> "[27]"
    k.chars = k.text.length;
  }
  return blocks;
}
const kind = (b) => (b.title ? 'title' : Math.abs(b.h - state.bodyH) / state.bodyH < 0.06 && b.lines.length >= 2 && b.chars >= 120 ? 'body'
  : b.h > state.bodyH * 1.15 && b.chars < 90 ? 'heading' : 'minor');

function busy(big, small = '', frac = 0) {
  $('empty').hidden = false; $('view').hidden = true;
  $('empty').querySelector('.spinner').hidden = false;
  $('emptyBig').textContent = big; $('emptySmall').textContent = small;
  $('progress').firstElementChild.style.width = (frac * 100) + '%';
}
function fail(message) {
  $('empty').hidden = false; $('view').hidden = true;
  $('empty').querySelector('.spinner').hidden = true;
  $('emptyBig').textContent = 'Could not open that PDF'; $('emptySmall').textContent = message;
  $('progress').firstElementChild.style.width = '0';
}

async function load(data, name) {
  busy('Opening PDF…', name);
  const doc = await pdfjs.getDocument({ data }).promise;
  state.pages = []; state.name = name; state.total = doc.numPages;
  const dpr = window.devicePixelRatio || 1, hist = new Map(), n = Math.min(doc.numPages, MAX_PAGES), W = pageWidth();
  for (let i = 1; i <= n; i++) {
    busy('Rendering…', `page ${i} of ${n}`, (i - 1) / n);
    const page = await doc.getPage(i);
    const scale = W / page.getViewport({ scale: 1 }).width;
    const vp = page.getViewport({ scale }), big = page.getViewport({ scale: scale * dpr });
    const canvas = document.createElement('canvas');
    canvas.width = big.width; canvas.height = big.height; canvas.style.width = vp.width + 'px'; canvas.style.height = vp.height + 'px';
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: big }).promise;
    const items = [];
    for (const it of (await page.getTextContent()).items) {
      if (!it.str || !it.str.trim()) { if (items.length) items.at(-1).spaceAfter = true; continue; }
      const t = pdfjs.Util.transform(vp.transform, it.transform);
      if (Math.abs(t[1]) > Math.abs(t[0])) continue;   // rotated text (margin watermarks)
      items.push({ str: it.str, x: t[4], y: t[5], w: it.width * scale, h: Math.hypot(t[2], t[3]) });
    }
    const blocks = toBlocks(toLines(items));
    for (const b of blocks) { const k = Math.round(b.h * 2) / 2; hist.set(k, (hist.get(k) || 0) + b.chars); }
    state.pages.push({ canvas, w: vp.width, h: vp.height, blocks });
  }
  state.bodyH = [...hist].sort((a, b) => b[1] - a[1])[0]?.[0] || 10;
  // the document title: the largest short block on the first page
  const first = state.pages[0].blocks.filter((b) => b.chars < 200 && b.chars > 3).sort((a, b) => b.h - a.h)[0];
  if (first && first.h > state.bodyH * 1.2) { first.title = true; state.title = first.text; } else state.title = name;
  $('progress').firstElementChild.style.width = '100%';
  setTimeout(() => { $('progress').firstElementChild.style.width = '0'; }, 400);
  $('empty').hidden = true; $('view').hidden = false;
  render();
}

// ---- A: gradient strips over the canvas ----
function renderA(view) {
  const pal = SCHEMES[state.scheme][state.dark ? 'dark' : 'light'];
  let coloured = 0;
  state.pages.forEach((p, pi) => {
    const sheet = document.createElement('section'); sheet.className = 'sheet'; sheet.dataset.w = p.w;
    const num = document.createElement('div'); num.className = 'num'; num.textContent = `Page ${pi + 1}`;
    const el = document.createElement('div'); el.className = 'page'; el.style.width = p.w + 'px'; el.style.height = p.h + 'px';
    el.appendChild(p.canvas);
    for (const b of p.blocks) {
      if (state.bodyOnly && kind(b) !== 'body') continue;
      coloured++;
      b.lines.forEach((l, i) => {
        const s = document.createElement('div'); s.className = 'strip';
        const pitch = b.lines[i + 1] ? b.lines[i + 1].y - l.y : l.h * 1.25;
        Object.assign(s.style, { left: l.left + 'px', top: (l.y - l.h * 0.92) + 'px', width: (l.right - l.left) + 'px', height: Math.min(l.h * 1.25, Math.max(l.h, pitch)) + 'px',
          backgroundImage: `linear-gradient(to right, ${pal[i % pal.length]}, ${pal[(i + 1) % pal.length]})`,
          backgroundSize: `${b.right - b.left}px 100%`, backgroundPosition: `${b.left - l.left}px 0` });
        el.appendChild(s);
      });
    }
    sheet.append(num, el); view.appendChild(sheet);
  });
  fit();
  return coloured;
}
// Pages are drawn at the width the window had on load; when it changes, scale
// the drawn page and its strips together rather than redrawing.
function fit() {
  const target = pageWidth();
  for (const sheet of document.querySelectorAll('.sheet')) {
    const f = target / +sheet.dataset.w;
    sheet.style.width = (+sheet.dataset.w * f) + 'px'; sheet.querySelector('.page').style.zoom = f;
  }
}
addEventListener('resize', fit);

// ---- B: reflowed text; the extension's own pipeline colours it ----
function paragraphs() {
  const out = [];
  const hasTitle = state.pages[0].blocks.some((b) => b.title);
  let started = !hasTitle;   // text above the title (notices, running heads) is not part of the reading text
  state.pages.forEach((p, pi) => {
    if (pi) out.push({ kind: 'pagebreak', text: `Page ${pi + 1}` });
    for (const b of p.blocks) {
      const k = kind(b), last = out.findLast((o) => o.kind !== 'pagebreak');
      if (k === 'title') started = true;
      if (!started) continue;
      // a paragraph cut by a column or page break continues
      if (k === 'body' && last && last.kind === 'body' && !/[.!?:”"]$/.test(last.text) && /^[a-z(]/.test(b.text)) { last.text = join(last.text, b.text); continue; }
      out.push({ kind: k, text: b.text });
    }
  });
  return out;
}
function renderB(view) {
  const col = document.createElement('article'); col.className = 'reflow';
  const TAG = { title: 'h1', heading: 'h2', pagebreak: 'div' };
  let n = 0;
  for (const p of paragraphs()) {
    if (p.kind === 'minor' && state.bodyOnly) continue;
    const el = document.createElement(TAG[p.kind] || 'p');
    if (p.kind === 'minor' || p.kind === 'pagebreak') el.className = p.kind;
    if (p.kind === 'body') n++;
    el.textContent = p.text; col.appendChild(el);
  }
  view.appendChild(col);
  return n;
}

function render() {
  document.body.classList.toggle('dark', state.dark);
  for (const b of document.querySelectorAll('.seg button')) b.setAttribute('aria-selected', b.dataset.v === state.variant);
  const swatch = (k) => { const c = SCHEMES[k][state.dark ? 'dark' : 'light']; return `linear-gradient(135deg, ${c[1]} 15%, ${c[3]} 85%)`; };
  for (const b of $('schemes').children) { b.setAttribute('aria-pressed', b.dataset.k === state.scheme); b.style.background = swatch(b.dataset.k); }
  $('schemeBtn').style.background = swatch(state.scheme); $('schemeBtn').title = `Colour scheme: ${SCHEMES[state.scheme].name}`;
  $('bodyOnly').setAttribute('aria-pressed', state.bodyOnly); $('theme').setAttribute('aria-pressed', state.dark);
  if (!state.pages.length) return;
  const view = $('view'); view.replaceChildren();
  const coloured = state.variant === 'A' ? renderA(view) : renderB(view);
  $('title').textContent = state.title; document.title = `${state.title} · Buzzline PDF (prototype)`;
  const shown = state.pages.length < state.total ? `first ${state.pages.length} of ${state.total} pages` : `${state.total} pages`;
  $('meta').textContent = `${shown} · ${coloured} ${state.variant === 'A' ? 'passages' : 'paragraphs'} coloured · ${SCHEMES[state.scheme].name}`;
  // full state, for the prototype: hover the status line
  $('meta').title = `view ${state.variant} · ${state.name} · ${state.pages.reduce((n, p) => n + p.blocks.reduce((m, b) => m + b.lines.length, 0), 0)} lines · ${state.pages.reduce((n, p) => n + p.blocks.length, 0)} blocks · body font ${state.bodyH}px · ${state.bodyOnly ? 'body text only' : 'all text'}`;
  const q = new URLSearchParams({ variant: state.variant, scheme: state.scheme, dark: state.dark ? '1' : '0' });
  if (!state.bodyOnly) q.set('all', '1'); if (state.file) q.set('file', state.file);
  history.replaceState(null, '', '?' + q);
}

// ---- controls ----
for (const [k, s] of Object.entries(SCHEMES)) { const b = document.createElement('button'); b.dataset.k = k; b.title = s.name; b.onclick = () => { state.scheme = k; chrome.storage.sync.set({ scheme: k }); $('schemeWrap').classList.remove('open'); render(); }; $('schemes').appendChild(b); }
$('schemeBtn').onclick = () => $('schemeWrap').classList.toggle('open');
for (const b of document.querySelectorAll('.seg button')) b.onclick = () => { state.variant = b.dataset.v; render(); scrollTo(0, 0); };
$('theme').onclick = () => { state.dark = !state.dark; render(); };
$('bodyOnly').onclick = () => { state.bodyOnly = !state.bodyOnly; render(); };
$('sprint').onclick = () => { const text = paragraphs().filter((p) => p.kind === 'body').map((p) => p.text).join(' '); if (text) window.__bzlnSprint(text); };
addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select, [contenteditable]') || document.querySelector('.bzln-sprint-root') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { const d = e.key === 'ArrowLeft' ? -1 : 1; state.variant = VARIANTS[(VARIANTS.indexOf(state.variant) + d + VARIANTS.length) % VARIANTS.length]; render(); }
  if (e.key === 'Escape') { $('openPanel').hidden = true; $('schemeWrap').classList.remove('open'); }
});

const fromUrl = async (url) => {
  state.file = url; $('openPanel').hidden = true; busy('Opening PDF…', url);
  const r = await fetch('/fetch?url=' + encodeURIComponent(url));
  if (!r.ok) throw new Error(`The server could not fetch ${url}`);
  await load(await r.arrayBuffer(), decodeURIComponent(url.split('/').pop() || url));
};
const fromFile = async (f) => { state.file = ''; $('openPanel').hidden = true; await load(await f.arrayBuffer(), f.name); };
const open = (p) => p.catch((e) => fail(e.message));
$('openBtn').onclick = () => { $('openPanel').hidden = !$('openPanel').hidden; if (!$('openPanel').hidden) { $('url').value = state.file; $('url').select(); } };
$('load').onclick = () => { const u = $('url').value.trim(); if (u) open(fromUrl(u)); };
$('url').onkeydown = (e) => { if (e.key === 'Enter') $('load').click(); };
$('pick').onclick = () => $('file').click();
$('file').onchange = () => { const f = $('file').files[0]; if (f) open(fromFile(f)); };
addEventListener('pointerdown', (e) => { if (!e.target.closest('#openPanel, #openBtn')) $('openPanel').hidden = true; if (!e.target.closest('#schemeWrap')) $('schemeWrap').classList.remove('open'); });
let drags = 0;
addEventListener('dragenter', (e) => { e.preventDefault(); drags++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--drags <= 0) { drags = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => { e.preventDefault(); drags = 0; document.body.classList.remove('dragging'); const f = e.dataTransfer.files[0]; if (f) open(fromFile(f)); });

render();
open(fromUrl(state.file));
</script>
</body>
</html>
